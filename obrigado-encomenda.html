<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <title>Encomenda recebida – Luthieria Baratieri</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#5c3b1e">
  <link rel="icon" href="favicon.png" type="image/png">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f0ea;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .box {
      background: #ffffff;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      max-width: 520px;
    }

    h1 {
      color: #5c3b1e;
      margin-bottom: 15px;
      font-size: 1.6rem;
    }

    p {
      font-size: 18px;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      display: inline-block;
      padding: 12px 22px;
      background: #8b5a2b;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      transition: 0.2s;
    }

    .btn:hover {
      background: #6e4521;
    }

    .btn-whatsapp {
      background: #25d366;
    }

    .btn-whatsapp:hover {
      background: #1ebe57;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>Cadastro da encomenda enviado!</h1>
    <p>
      Recebi seus dados. Em breve confirmo os próximos passos da construção do seu instrumento.
      Se precisar complementar algo, me chame no WhatsApp.
    </p>

    <div class="actions">
      <a href="/" class="btn">Voltar para o site</a>
      <a href="https://wa.me/5545920028659" class="btn btn-whatsapp">Falar no WhatsApp</a>
    </div>
  </div>
</body>

</html>
